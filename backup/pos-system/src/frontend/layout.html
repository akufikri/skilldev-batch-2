<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS Kafe Pintar | Sistem Point of Sale</title>
    <link rel="stylesheet" href="../../assets/css/style-v2.css" />
  </head>
  <body>
    <!-- root layout -->
    <main class="layout">
      <!-- content 1 | card kebawah -->
      <section class="section-1">
        <!-- card 1 -->
        <div class="card-1">
          <div class="card-content-1">
            <img
              src="../../assets/images/anime.jpeg"
              alt="Gambar anime"
              srcset=""
            />
            <div>
              <h1>Anime List 1</h1>
              <p>Description of the anime.</p>
            </div>
          </div>
          <div class="card-button">
            <button class="button">Add to Cart</button>
          </div>
        </div>
        <!-- card 2 -->
        <div class="card-1">
          <div class="card-content-1">
            <img
              src="../../assets/images/anime.jpeg"
              alt="Gambar anime 2"
              srcset=""
            />
            <div>
              <h1>Anime List 2</h1>
              <p>Description of the second anime.</p>
            </div>
          </div>
          <div class="card-button">
            <button class="button">Add to Cart</button>
          </div>
        </div>
      </section>

      <!-- content 2 | card menyamping -->
      <section class="section-2">
        <!-- card 1 -->
        <div class="card-2">
          <div class="card-content-2">
            <div class="container-img">
              <img
                src="../../assets/images/anime.jpeg"
                alt="Gambar anime"
                srcset=""
              />
            </div>
            <div>
              <h1>Anime List 1</h1>
              <p>Description of the anime.</p>
            </div>
          </div>
          <div class="card-button card-right-button">
            <button class="button">Add to Cart</button>
          </div>
        </div>
        <!-- card 2 -->
        <div class="card-2">
          <div class="card-content-2">
            <div class="container-img">
              <img
                src="../../assets/images/anime.jpeg"
                alt="Gambar anime 2"
                srcset=""
              />
            </div>
            <div>
              <h1>Anime List 2</h1>
              <p>Description of the second anime.</p>
            </div>
          </div>
          <div class="card-button card-right-button">
            <button class="button">Add to Cart</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
